name: Deploy website (optional)
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Update news']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: newslens-pages
  cancel-in-progress: false
jobs:
  build:
    if: vars.ENABLE_PAGES == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Verify real output exists
        run: test -s web/public/data/latest.json
      - name: Build static website
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_DATA_MODE: live
        run: npm run build --prefix web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
