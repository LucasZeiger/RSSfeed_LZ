name: Update news
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: newslens-data-update
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          enable-cache: true
      - run: uv sync --frozen
      - name: Collect real news
        id: collect
        continue-on-error: true
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          NEWSLENS_AI_KEY: ${{ secrets.NEWSLENS_AI_KEY }}
          NEWSLENS_AI_MODEL: ${{ vars.NEWSLENS_AI_MODEL }}
          NEWSLENS_AI_URL: ${{ vars.NEWSLENS_AI_URL }}
        run: uv run python -m backend.cli collect
      - run: uv run python -m backend.cli validate
      - name: Persist bounded output and state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for path in data/state.json data/markets-cache.json web/public/data/latest.json web/public/data/status.json; do
            if [ -f "$path" ]; then git add -f "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh bounded news dataset [skip ci]'
            git push
          fi
      - name: Flag total collection failure after preserving status
        if: steps.collect.outcome == 'failure'
        run: exit 1
