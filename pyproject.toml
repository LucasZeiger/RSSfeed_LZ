[project]
name = "newslens"
version = "0.1.0"
description = "Evidence-first news comparison and financial context"
requires-python = ">=3.12"
dependencies = ["feedparser>=6.0.11,<7", "httpx>=0.28,<1", "pydantic>=2.10,<3", "PyYAML>=6,<7", "bleach>=6,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
